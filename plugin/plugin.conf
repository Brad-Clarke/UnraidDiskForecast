# Release settings read by scripts/build.sh. Edit these, not the build script.

# GitHub owner/repository the releases are published to. The .plg's pluginURL and the
# Community Apps listing are both built from it and must match character for character.
REPOSITORY="Brad-Clarke/UnraidDiskForecast"

# The plugin's support thread on forums.unraid.net. Releases are refused until this is a
# real forum URL.
SUPPORT_URL="@SUPPORT_URL@"

# Lowest Unraid version the plugin has been tested on.
MIN_VERSION="7.0.0"
